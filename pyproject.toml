[project]
name = "serdeskit"
version = "0.1.0"
description = "System-level SerDes link modeling (channel/CTLE/FFE/DFE) with a clean, typed, testable architecture."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-rf>=1.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "scipy-stubs>=1.12",
    "pychopmarg==3.1.2",  # golden reference for COM-related unit tests (e.g. pmf/)
]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = "skrf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rx_tline_segments: skipped, deliberately diverges from PyChOpMarg's RX package assembly (commit 631f2f5, docs/known-issues.md)",
    "h21_taper_removal: skipped or fixture-adjusted due to dropping SParameterChannel.transfer_function()'s raised-cosine taper (commit 59fe9ba, docs/known-issues.md)",
    "ffe_cursor_referenced_delay: skipped or fixture-adjusted due to TapWeightFfe referencing delay 0 at the cursor tap instead of the first tap, to match MATLAB (docs/known-issues.md)",
    "tx_filter_unwired_in_search: skipped -- EqualizationSearch builds Link without a tx_filter, unwired since search/optimization-level MATLAB alignment is explicitly out of scope (CLAUDE.md, docs/known-issues.md)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
