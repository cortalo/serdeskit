[project]
name = "serdeskit"
version = "0.1.0"
description = "System-level SerDes link modeling (channel/CTLE/FFE/DFE) with a clean, typed, testable architecture."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-rf>=1.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "scipy-stubs>=1.12",
]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = "skrf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
